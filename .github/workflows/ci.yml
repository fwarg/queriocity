name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Advisory only: `bun audit` exits non-zero on any finding, and drizzle-orm currently
      # carries an unfixed one (GHSA-gpj5-g38j-94v9, needs 0.30 -> 0.45). Drop the `|| true`
      # once that is resolved so a new advisory actually fails the build.
      # Dependabot covers bun for version updates but not security updates, so this step is
      # the only automated signal we get.
      - name: Dependency audit (advisory)
        run: bun audit --prod || true
