version: 2
updates:
  # Dependabot supports bun for version updates only (security updates are not available for
  # this ecosystem), and reads the text bun.lock — not the legacy binary bun.lockb.
  # The security signal comes from the `bun audit` step in ci.yml instead.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # One PR per cluster keeps the noise down; the AI SDK is excluded from grouping because
      # a bump there is a migration, not an update.
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: ["ai", "@ai-sdk/*"]
        update-types: ["minor", "patch"]
    ignore:
      # `ai` and its providers must move together — `@ai-sdk/openai` v4 pairs with `ai` v7, and
      # bumping either alone leaves makeProvider() returning `LanguageModelV1 | LanguageModelV4`,
      # which fails at every `model:` site. Dependabot proved this with two PRs that could never
      # go green. Majors here are a coordinated migration (see development.md); do them by hand.
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ollama-ai-provider"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
