services:
  queriocity:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: env.local
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      # Published on all interfaces because a containerised reverse proxy (e.g. Nginx Proxy
      # Manager) reaches the app through the host — for it, 127.0.0.1 is its own container.
      # Use "127.0.0.1:8012:3000" only if the proxy runs directly on the host, or see the
      # README's reverse-proxy section for attaching the proxy's Docker network instead.
      - "8012:3000"
    environment:
        IMAGE_STORAGE_DIR: /images
    volumes:
      - ./data:/data
      - ./data/images:/images
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "privoxy-vpn:10.200.1.2"
    restart: unless-stopped
